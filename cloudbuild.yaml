# Auto-deploy: every push to main on GitHub builds Growvia and rolls it out to Cloud Run (Tokyo).
# Environment variables and service settings stay as they are on the service (set once by deploy/cloudrun.sh).
substitutions:
  _REGION: asia-northeast1
  _SERVICE: growvia
  _IMAGE: asia-northeast1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/growvia
steps:
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["-c", "docker pull ${_IMAGE}:latest || true"]
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "--cache-from", "${_IMAGE}:latest", "-t", "${_IMAGE}:${SHORT_SHA}", "-t", "${_IMAGE}:latest", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "${_SERVICE}", "--image", "${_IMAGE}:${SHORT_SHA}", "--region", "${_REGION}", "--quiet"]
images: ["${_IMAGE}:${SHORT_SHA}", "${_IMAGE}:latest"]
timeout: 1500s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_STANDARD_2
